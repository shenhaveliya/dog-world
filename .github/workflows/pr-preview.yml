name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site bundle
        run: |
          mkdir -p _site
          rsync -a \
            --exclude node_modules \
            --exclude scripts \
            --exclude .github \
            --exclude .git \
            --exclude _site \
            ./ _site/

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          destination_dir: previews/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: https://shenhaveliya.github.io/dog-world/previews/pr-${{ github.event.pull_request.number }}/
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;
            const marker = '<!-- pr-preview-bot -->';
            const body = `${marker}
            ## 🔗 Preview

            **[Open preview](${previewUrl})**

            \`${previewUrl}\`

            Branch: \`${context.payload.pull_request.head.ref}\`

            > Requires GitHub Pages source: **Deploy from branch \`gh-pages\` / root**. Production: [shenhaveliya.github.io/dog-world](https://shenhaveliya.github.io/dog-world/)
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
