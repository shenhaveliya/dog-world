name: PR preview cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove preview folder from gh-pages
        continue-on-error: true
        run: |
          git clone --depth=1 --branch=gh-pages \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages-work
          cd gh-pages-work
          PREVIEW_DIR="previews/pr-${{ github.event.pull_request.number }}"
          if [ ! -d "$PREVIEW_DIR" ]; then
            echo "Preview folder not found, nothing to clean."
            exit 0
          fi
          rm -rf "$PREVIEW_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && exit 0
          git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}"
          git push
