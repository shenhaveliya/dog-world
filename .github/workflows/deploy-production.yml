name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site bundle
        run: |
          mkdir -p _site
          rsync -a \
            --exclude node_modules \
            --exclude scripts \
            --exclude .github \
            --exclude .git \
            --exclude _site \
            ./ _site/

      - name: Deploy to gh-pages (production root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: _site
          keep_files: true

      - name: Point GitHub Pages to gh-pages branch
        continue-on-error: true
        run: |
          gh api repos/${{ github.repository }}/pages -X PUT \
            -f build_type=legacy \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
