name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site bundle
        run: |
          mkdir -p _site
          rsync -a \
            --exclude node_modules \
            --exclude scripts \
            --exclude .github \
            --exclude .git \
            --exclude _site \
            ./ _site/

      - name: Deploy to gh-pages (production root)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          workdir=$(mktemp -d)
          git clone --depth=100 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
            "$workdir"
          rsync -a _site/ "$workdir/"
          cd "$workdir"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No production changes to deploy"
            exit 0
          fi
          git commit -m "deploy: ${{ github.sha }}"
          for attempt in 1 2 3 4 5 6; do
            if git push origin gh-pages; then
              echo "Deploy succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}), rebasing on latest gh-pages..."
            git fetch origin gh-pages
            git rebase origin/gh-pages
            sleep $((attempt * 2))
          done
          echo "Deploy failed after retries"
          exit 1

      - name: Point GitHub Pages to gh-pages branch
        continue-on-error: true
        run: |
          gh api repos/${{ github.repository }}/pages -X PUT \
            -f build_type=legacy \
            -f 'source[branch]=gh-pages' \
            -f 'source[path]=/'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
